<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Hub 回执</title>
  <style>
    /* 2026-11-11 用户反馈原来的大卡太扰人：改成克制的一行标题 + 一行摘要小卡，可在设置里改成交给桌宠或关闭。 */
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    body { padding: 6px; }
    .card {
      position: relative; width: 100%; height: 100%; overflow: hidden; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, .09); border-radius: 12px;
      background: rgba(23, 26, 35, .97);
      box-shadow: 0 3px 10px rgba(0, 0, 0, .28);
      color: #eef0f5; -webkit-app-region: no-drag;
    }
    .card:hover { border-color: rgba(167, 139, 250, .38); }
    .content { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; column-gap: 10px; align-items: center; padding: 9px 6px 0 11px; }
    .mark { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: rgba(86, 211, 100, .16); color: #6ee787; }
    .mark svg { width: 13px; height: 13px; stroke: currentColor; }
    .mark .bad { display: none; }
    .card[data-tone="bad"] .mark { background: rgba(248, 81, 73, .18); color: #ff7b72; }
    .card[data-tone="bad"] .mark .ok { display: none; }
    .card[data-tone="bad"] .mark .bad { display: block; }
    .card[data-tone="bad"] { border-color: rgba(248, 81, 73, .42); }
    .main { min-width: 0; }
    .head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    h1 { flex: 0 1 auto; min-width: 0; margin: 0; overflow: hidden; color: #fff; font-size: 13px; line-height: 1.35; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .time, .count { flex: none; color: #8f93a4; font-size: 10.5px; }
    .count { color: #c4b5fd; }
    p { margin: 2px 0 0; overflow: hidden; color: #b9bcc8; font-size: 11.5px; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
    .tools { display: flex; gap: 2px; }
    .tool { display: grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 6px; background: transparent; color: #7d8192; cursor: pointer; font-size: 15px; line-height: 1; }
    .tool svg { width: 13px; height: 13px; stroke: currentColor; }
    .tool:hover { background: rgba(255,255,255,.08); color: #fff; }
    .progress { position: absolute; right: 0; bottom: 0; left: 0; height: 2px; overflow: hidden; background: transparent; }
    p:empty { display: none; }
    .progress::after { content: ""; display: block; width: 100%; height: 100%; transform-origin: left; background: rgba(167, 139, 250, .4); }
    .card[data-tone="bad"] .progress::after { background: rgba(255, 123, 114, .6); }
    .progress.running::after { animation: drain var(--notification-timeout, 6000ms) linear forwards; }
    @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { .progress.running::after { animation: none; } }
  </style>
</head>
<body>
  <article class="card" id="notification-card" title="点击打开会话" aria-label="AI 会话回执，点击打开">
    <div class="content">
      <div class="mark" aria-hidden="true">
        <svg class="ok" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <svg class="bad" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M12 6v8M12 18.5v.01"/></svg>
      </div>
      <div class="main">
        <div class="head"><h1 id="notification-title">AI 会话</h1><span class="count" id="notification-count" hidden></span><span class="time" id="notification-time"></span></div>
        <p id="notification-body"></p>
      </div>
      <div class="tools">
        <button class="tool" id="notification-settings" type="button" title="回执设置：右下角小卡 / 交给桌宠 / 关闭" aria-label="回执设置">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button class="tool" id="notification-close" type="button" title="关闭这条" aria-label="关闭这条">×</button>
      </div>
    </div>
    <div class="progress" id="notification-progress" aria-hidden="true"></div>
  </article>
</body>
</html>
