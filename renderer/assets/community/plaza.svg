<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9e3f7"/><stop offset="1" stop-color="#f8f1e8"/></linearGradient>
            <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="skewX(-20)"><rect width="40" height="40" fill="#f2ece2"/><path d="M0 0H40M0 0V40" stroke="#e6ddcf" stroke-width="1.4"/></pattern>
            <radialGradient id="water" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#e3f1fb"/><stop offset="1" stop-color="#b9d9ef"/></radialGradient>
          </defs>
          <rect width="1000" height="640" fill="url(#sky)"/>
          <!-- 远处的楼 -->
          <g fill="#ddd5ec">
            <rect x="40" y="70" width="90" height="120" rx="4"/><rect x="140" y="40" width="70" height="150" rx="4"/><rect x="225" y="95" width="110" height="95" rx="4"/>
            <rect x="660" y="55" width="80" height="135" rx="4"/><rect x="752" y="85" width="120" height="105" rx="4"/><rect x="884" y="30" width="80" height="160" rx="4"/>
          </g>
          <g fill="#f3eefb" opacity=".9">
            <rect x="55" y="88" width="14" height="10"/><rect x="80" y="88" width="14" height="10"/><rect x="105" y="88" width="14" height="10"/><rect x="55" y="110" width="14" height="10"/><rect x="105" y="110" width="14" height="10"/>
            <rect x="152" y="60" width="12" height="10"/><rect x="176" y="60" width="12" height="10"/><rect x="152" y="84" width="12" height="10"/><rect x="176" y="108" width="12" height="10"/>
            <rect x="675" y="75" width="12" height="10"/><rect x="700" y="75" width="12" height="10"/><rect x="675" y="100" width="12" height="10"/><rect x="700" y="125" width="12" height="10"/>
            <rect x="898" y="50" width="12" height="10"/><rect x="925" y="50" width="12" height="10"/><rect x="898" y="76" width="12" height="10"/><rect x="925" y="102" width="12" height="10"/>
          </g>
          <!-- 云 -->
          <g fill="#fff" opacity=".85"><ellipse cx="420" cy="62" rx="46" ry="14"><animate attributeName="cx" values="420;470;420" dur="40s" repeatCount="indefinite"/></ellipse><ellipse cx="450" cy="54" rx="30" ry="12"><animate attributeName="cx" values="450;500;450" dur="40s" repeatCount="indefinite"/></ellipse><ellipse cx="585" cy="105" rx="38" ry="10"><animate attributeName="cx" values="585;545;585" dur="34s" repeatCount="indefinite"/></ellipse></g>
          <!-- 草地与广场地面 -->
          <path d="M0 190 H1000 V640 H0 Z" fill="#dcebcd"/>
          <path d="M0 214 Q500 186 1000 214 V640 H0Z" fill="#d2e5c0"/>
          <ellipse cx="500" cy="440" rx="470" ry="200" fill="url(#tile)" stroke="#e3d8c6" stroke-width="3"/>
          <ellipse cx="500" cy="440" rx="470" ry="200" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1" stroke-dasharray="2 10"/>
          <!-- 喷泉 -->
          <ellipse cx="500" cy="372" rx="92" ry="34" fill="#e7dccb"/>
          <ellipse cx="500" cy="366" rx="80" ry="28" fill="url(#water)"/>
          <ellipse cx="500" cy="366" rx="40" ry="12" fill="none" stroke="#fff" stroke-opacity=".8"><animate attributeName="rx" values="20;78" dur="3s" repeatCount="indefinite"/><animate attributeName="ry" values="6;27" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".9;0" dur="3s" repeatCount="indefinite"/></ellipse>
          <rect x="492" y="318" width="16" height="48" rx="6" fill="#e2d6c3"/>
          <path d="M500 318 q-22 -22 -36 6 M500 318 q22 -22 36 6" stroke="#bfe0f4" stroke-width="3" fill="none" stroke-linecap="round"><animate attributeName="stroke-opacity" values=".5;1;.5" dur="1.6s" repeatCount="indefinite"/></path>
          <!-- 树 -->
          <g><rect x="92" y="250" width="10" height="38" rx="3" fill="#b99a7a"/><circle cx="97" cy="236" r="30" fill="#a9d18f"/><circle cx="78" cy="250" r="20" fill="#9cc884"/><circle cx="116" cy="248" r="18" fill="#b5d99c"/></g>
          <g><rect x="892" y="246" width="10" height="40" rx="3" fill="#b99a7a"/><circle cx="897" cy="230" r="32" fill="#a9d18f"/><circle cx="876" cy="246" r="20" fill="#9cc884"/><circle cx="918" cy="244" r="19" fill="#b5d99c"/></g>
          <g><rect x="36" y="520" width="12" height="44" rx="3" fill="#b99a7a"/><circle cx="42" cy="500" r="36" fill="#a2cd88"/><circle cx="66" cy="516" r="20" fill="#b5d99c"/></g>
          <g><rect x="952" y="520" width="12" height="44" rx="3" fill="#b99a7a"/><circle cx="958" cy="500" r="36" fill="#a2cd88"/><circle cx="934" cy="516" r="20" fill="#b5d99c"/></g>
          <!-- 长椅 -->
          <g fill="#c7a27e"><rect x="214" y="300" width="74" height="9" rx="3"/><rect x="214" y="288" width="74" height="7" rx="3" fill="#d4b190"/><rect x="220" y="309" width="5" height="14"/><rect x="277" y="309" width="5" height="14"/></g>
          <g fill="#c7a27e"><rect x="712" y="300" width="74" height="9" rx="3"/><rect x="712" y="288" width="74" height="7" rx="3" fill="#d4b190"/><rect x="718" y="309" width="5" height="14"/><rect x="775" y="309" width="5" height="14"/></g>
          <!-- 路灯 -->
          <g><rect x="350" y="220" width="5" height="82" fill="#8f86a3"/><circle cx="352" cy="216" r="9" fill="#fbf2d2" stroke="#8f86a3" stroke-width="2"/></g>
          <g><rect x="645" y="220" width="5" height="82" fill="#8f86a3"/><circle cx="647" cy="216" r="9" fill="#fbf2d2" stroke="#8f86a3" stroke-width="2"/></g>
          <!-- 花坛 -->
          <g><ellipse cx="170" cy="600" rx="70" ry="16" fill="#cfe2b8"/><circle cx="140" cy="594" r="5" fill="#f4a9b8"/><circle cx="162" cy="598" r="5" fill="#f7d26b"/><circle cx="184" cy="592" r="5" fill="#c9a8ef"/><circle cx="204" cy="600" r="5" fill="#f4a9b8"/></g>
          <g><ellipse cx="830" cy="600" rx="70" ry="16" fill="#cfe2b8"/><circle cx="800" cy="594" r="5" fill="#c9a8ef"/><circle cx="822" cy="600" r="5" fill="#f4a9b8"/><circle cx="846" cy="592" r="5" fill="#f7d26b"/><circle cx="866" cy="598" r="5" fill="#c9a8ef"/></g>
          <!-- 指路牌 -->
          <g><rect x="934" y="330" width="5" height="70" fill="#a98a6a"/><path d="M890 330 h70 l12 11 -12 11 h-70z" fill="#efe1cb" stroke="#c9ad8a"/><text x="922" y="345.5" font-size="11.5" text-anchor="middle" fill="#7a6247" font-family="Microsoft YaHei, sans-serif">团队小屋 →</text></g>
          <!-- 广场旗 -->
          <g><rect x="497" y="160" width="3" height="60" fill="#8f86a3"/><path d="M500 162 h44 l-8 10 8 10 h-44z" fill="#5b3a8c"/><text x="519" y="176" font-size="10" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei, sans-serif">广场</text></g>
        </svg>
